name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1" # weekly CVE sweep
permissions:
  contents: read
jobs:
  osv:
    name: dependency CVEs (osv-scanner)
    runs-on: ubuntu-latest
    env:
      OSV_VERSION: "2.7.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install osv-scanner
        run: |
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner --version
      - name: Scan lockfile
        run: osv-scanner scan source --lockfile package-lock.json
  zizmor:
    name: workflow lint (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.32.0 --format plain .github/workflows
