name: CI

on:
  pull_request:
    branches: [main, 'feat/**']
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Privacy grep
        run: |
          if git grep -nE 'qnqncrrrm|sb_secret_|sb_publishable_[A-Za-z0-9]{10}|AIza|8277cf934ae|0x4AAAAAAF|sponsor' -- . ':!.github/workflows/ci.yml' ':!package-lock.json'; then
            echo "Private material found in the repo" >&2
            exit 1
          fi

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_AUTH_SITE_URL: http://localhost:3000
      # Cloudflare's public always-pass TEST secret: local/CI only, never a real secret
      SUPABASE_AUTH_CAPTCHA_SECRET: 1x0000000000000000000000000000000AA
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.109.1
      - name: Start local stack
        run: npm run db:start -- -x studio,imgproxy,edge-runtime,logflare,vector,supabase_pooler,realtime,postgres-meta,inbucket
      - run: supabase db reset
      - run: npm run db:test
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:concurrency
